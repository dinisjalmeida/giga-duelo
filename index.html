<body>
<div class="shell" id="app"></div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>
<script type="module">
import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js";

const GAMES = [
  { id:"chess", name:"Xadrez", icon:"♞", hint:"Regras do xadrez", description:"Move uma peça por turno e protege o teu rei. Vence quem fizer xeque-mate ao rei adversário." },
  { id:"connect4", name:"Quatro em linha", icon:"🔴", hint:"Liga quatro peças", description:"Deixa cair uma peça numa coluna. Liga quatro da tua cor na horizontal, vertical ou diagonal." },
  { id:"checkers", name:"Damas", icon:"◉", hint:"Captura e promove", description:"Move na diagonal e salta por cima das peças do rival para as capturar. Leva uma peça ao outro lado para a promover a dama." },
  { id:"reversi", name:"Reversi", icon:"⚫", hint:"Vira as peças do rival", description:"Coloca uma peça para cercar e virar peças do rival. No fim, vence quem tiver mais peças no tabuleiro." }
];
const PIECE_SHAPES = {
  p:'<circle cx="50" cy="21" r="10"/><path d="M43 34h14c-1 8-3 13-1 18l8 8 3 12h7v9H26v-9h7l3-12 8-8c2-5 0-10-1-18Z"/>',
  r:'<path d="M27 20h11v11h9V20h7v11h9V20h11v22l-7 6v29l9 7v8H24v-8l9-7V48l-6-6V20Z"/>',
  n:'<path d="M24 80h54l-4-13-10-8 10-15-4-15-13-14-18 3-14 14 9 11-12 8-8 13 10 9Z"/><circle cx="59" cy="35" r="2.4" fill="var(--piece-outline)" stroke="none"/><path class="piece-detail" d="M40 51c8-4 15-5 22-3"/>',
  b:'<circle cx="50" cy="20" r="7"/><path d="M50 29c-10 10-14 18-10 27l-8 10-3 12 8 8h26l8-8-3-12-8-10c4-9 0-17-10-27Z"/><path class="piece-detail" d="m44 37 12 15"/>',
  q:'<circle cx="24" cy="25" r="6"/><circle cx="41" cy="18" r="6"/><circle cx="59" cy="18" r="6"/><circle cx="76" cy="25" r="6"/><path d="m25 34 8 31-6 14h46l-6-14 8-31-18 15-7-24-7 24-18-15Z"/>',
  k:'<path d="M46 10h8v10h10v8H54v8c9 5 13 13 12 22l-2 8 8 10v8H28v-8l8-10-2-8c-1-9 3-17 12-22v-8H36v-8h10V10Z"/><path class="piece-detail" d="M50 13v9M46 18h8"/>'
};
let peer = null, conn = null, role = null, mySide = null, gameState = null;
let chessEngine = null, selectedSquare = null, toastTimer = null;
const app = document.getElementById("app");
const modalRoot = document.getElementById("modal-root");

function escapeHtml(value){return String(value||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function isLocalAddress(){return location.protocol==="file:"||["localhost","127.0.0.1","::1"].includes(location.hostname)}
function initials(name){return (name||"?").trim().slice(0,1).toUpperCase()||"?"}
function showToast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2300)}
function shuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gameMeta(id){return GAMES.find(g=>g.id===id)||GAMES[0]}
function randomSide(){return Math.random()<.5?0:1}
function newGame(id){
  const starter=randomSide();
  if(id==="chess"){chessEngine=new Chess();return {id:id,starter:starter,fen:chessEngine.fen()}}
  if(id==="connect4")return {id:id,starter:starter,turn:starter,board:Array.from({length:6},()=>Array(7).fill(0))}
  if(id==="checkers"){
    const board=Array.from({length:8},()=>Array(8).fill(0));
    for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]=2;
    for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]=1;
    return {id:id,starter:starter,turn:starter,board:board,forced:null}
  }
  const board=Array.from({length:8},()=>Array(8).fill(0));
  board[3][3]=2;board[3][4]=1;board[4][3]=1;board[4][4]=2;
  return {id:"reversi",starter:starter,turn:starter,board:board}
}

  });

function attachHostConnection(){
  conn.on("open",()=>setPeerStatus(true));
  conn.on("data",msg=>{
    if(!msg||!gameState)return;
    if(msg.type==="join"){
      if(gameState.names[1])return;
      gameState.names[1]=String(msg.name||"Rival").slice(0,18);
      gameState.phase="playing";
      sendState();
      return;
    }
    if(msg.type==="action")handleHostAction(1,msg.action,msg.data||{});
  });
  conn.on("close",()=>{setPeerStatus(false);showToast("O teu rival desligou-se.");});
  conn.on("error",()=>showToast("A ligação com o rival teve um problema."));
}
function joinRoom(name,roomId){
  if(typeof Peer==="undefined"){renderWait("guest");showToast("Não foi possível carregar a ligação online.");return}
  role="guest";mySide=1;renderWait("guest");
  peer=new Peer();
  peer.on("open",()=>{
    conn=peer.connect(roomId,{reliable:true});
    conn.on("open",()=>{setPeerStatus(true);conn.send({type:"join",name:name})});
    conn.on("data",msg=>{
      if(msg&&msg.type==="state"){gameState=msg.state;chessEngine=null;selectedSquare=null;renderArena()}
      if(msg&&msg.type==="error")showToast(msg.message||"Não foi possível entrar.");
    });
    conn.on("close",()=>{setPeerStatus(false);showToast("A ligação com a sala foi perdida.")});
    conn.on("error",()=>showToast("Não foi possível ligar. Confirma que o link ainda está ativo."));
  });

}

  }

function checkerMoves(board,player,forced){
  const dirs=player===0?[-1]:[1],captures=[],steps=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const v=board[r][c],owner=(v===1||v===3)?0:(v===2||v===4)?1:-1;
    if(owner!==player||(forced&&(forced.r!==r||forced.c!==c)))continue;
    const king=v>=3,allDirs=king?[-1,1]:dirs;
    for(const dr of allDirs)for(const dc of [-1,1]){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>7||nc<0||nc>7)continue;
      if(board[nr][nc]===0)steps.push({from:{r:r,c:c},to:{r:nr,c:nc},capture:null});
      else{
        const target=board[nr][nc],enemy=(target===1||target===3)?0:(target===2||target===4)?1:-1;
        const jr=r+dr*2,jc=c+dc*2;
        if(enemy!==-1&&enemy!==player&&jr>=0&&jr<8&&jc>=0&&jc<8&&board[jr][jc]===0)captures.push({from:{r:r,c:c},to:{r:jr,c:jc},capture:{r:nr,c:nc}});
      }
    }
  }
  return captures.length?captures:steps;
}
function renderCheckersBoard(){
  const g=gameState.game,flip=mySide===1,legal=gameState.phase==="playing"&&isMyTurn()?checkerMoves(g.board,g.turn,g.forced):[];
  let html='<div class="checkers-board board">';
  for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++){
    const r=flip?7-rr:rr,c=flip?7-cc:cc,v=g.board[r][c],classes=["checker-square",(rr+cc)%2?"dark":"light"];
    if(selectedSquare===r+","+c)classes.push("selected");
    if(legal.some(m=>m.from.r===r&&m.from.c===c))classes.push("movable");
    const destination=legal.some(m=>m.to.r===r&&m.to.c===c);if(destination)classes.push("legal");
    html+='<button class="'+classes.join(" ")+'" data-checker="'+r+','+c+'">'+(v?'<i class="checker '+((v===1||v===3)?"p1":"p2")+'">'+(v>=3?"♛":"")+'</i>':"")+'</button>';
  }
  return html+'</div>';
}

  const engine=new Chess(gameState.game.fen),piece=engine.get(square);
  if(selectedSquare){
    const choices=engine.moves({square:selectedSquare,verbose:true});
    if(choices.some(m=>m.to===square)){sendAction("move",{from:selectedSquare,to:square,promotion:"q"});selectedSquare=null;return}
  }
  if(piece&&piece.color===(activePlayer()===gameState.game.starter?"w":"b"))selectedSquare=square;else selectedSquare=null;
  renderArena();
}
function handleCheckerClick(pos){
  if(!isMyTurn())return;
  const parts=pos.split(",").map(Number),r=parts[0],c=parts[1],g=gameState.game;
  const moves=checkerMoves(g.board,g.turn,g.forced);
  if(selectedSquare){
    const [sr,sc]=selectedSquare.split(",").map(Number);
    if(moves.some(m=>m.from.r===sr&&m.from.c===sc&&m.to.r===r&&m.to.c===c)){sendAction("move",{from:{r:sr,c:sc},to:{r:r,c:c}});selectedSquare=null;return}
  }
  const value=g.board[r][c],owner=(value===1||value===3)?0:(value===2||value===4)?1:-1;
  selectedSquare=owner===g.turn?r+","+c:null;renderArena();
}
function sendAction(action,data){
  if(role==="host")handleHostAction(0,action,data);
  else if(conn&&conn.open)conn.send({type:"action",action:action,data:data});
}
function handleHostAction(side,action,data){
  if(!gameState)return;
  if(action==="vote"&&gameState.phase==="vote"){
    if(data.choice==="revenge"){
      gameState.votes[side]="revenge";
      if(gameState.votes[0]==="revenge"&&gameState.votes[1]==="revenge"){
        gameState.phase="playing";gameState.result=null;gameState.votes=[null,null];gameState.matchNumber=(gameState.matchNumber||1)+1;gameState.game=newGame(gameState.game.id);selectedSquare=null;sendState();return;
      }
      sendState();return;
    }
    if(data.choice==="choose"&&GAMES.some(g=>g.id===data.gameId)&&data.gameId!==gameState.game.id){nextGame(data.gameId);return}
    if(data.choice==="random"){nextGame();return}
    return;
  }
  if(action!=="move"||gameState.phase!=="playing"||activePlayer()!==side)return;
  const g=gameState.game;
  if(g.id==="chess"){
    try{
      const engine=chessEngine||new Chess(g.fen);
      const move=engine.move({from:data.from,to:data.to,promotion:data.promotion||"q"});
      if(!move)return;
      chessEngine=engine;g.fen=engine.fen();selectedSquare=null;
      if(engine.isCheckmate()){finishGame(side,"Xeque-mate! "+gameState.names[side]+" ganha.");return}
      if(engine.isDraw()){finishGame(null,"Empate por regras de xadrez.");return}
    }catch(e){return}
  }else if(g.id==="connect4"){
    const c=data.col;if(!Number.isInteger(c)||c<0||c>6)return;
    let row=-1;for(let r=5;r>=0;r--)if(g.board[r][c]===0){row=r;break}if(row<0)return;
    g.board[row][c]=side+1;
    if(connectWins(g.board,row,c,side+1)){finishGame(side,gameState.names[side]+" alinha quatro peças.");return}
    if(g.board.every(row=>row.every(v=>v))){finishGame(null,"O tabuleiro encheu. Empate.");return}
    g.turn=1-side;
  }else if(g.id==="reversi"){
    const legal=reversiLegal(g.board,side),move=legal.find(m=>m.r===data.r&&m.c===data.c);if(!move)return;
    g.board[move.r][move.c]=side+1;for(const [r,c] of move.flips)g.board[r][c]=side+1;
    let next=1-side;
    if(reversiLegal(g.board,next).length===0){if(reversiLegal(g.board,side).length===0){const counts=countReversi(g.board);finishGame(counts[0]===counts[1]?null:counts[0]>counts[1]?0:1,"Reversi: "+counts[0]+" contra "+counts[1]+" peças.");return}next=side}
    g.turn=next;
  }else if(g.id==="checkers"){
    const moves=checkerMoves(g.board,side,g.forced),move=moves.find(m=>m.from.r===data.from.r&&m.from.c===data.from.c&&m.to.r===data.to.r&&m.to.c===data.to.c);if(!move)return;
    let value=g.board[move.from.r][move.from.c];g.board[move.from.r][move.from.c]=0;g.board[move.to.r][move.to.c]=value;
    if(move.capture)g.board[move.capture.r][move.capture.c]=0;
    if((side===0&&move.to.r===0&&value===1)||(side===1&&move.to.r===7&&value===2))g.board[move.to.r][move.to.c]=value+2;
    if(move.capture){
      const follow=checkerMoves(g.board,side,move.to);
      if(follow.some(m=>m.capture)){g.forced=move.to;g.turn=side}
      else{g.forced=null;g.turn=1-side}
    }else{g.forced=null;g.turn=1-side}
    const enemy=1-side,enemyPieces=g.board.flat().filter(v=>v&&((enemy===0&&(v===1||v===3))||(enemy===1&&(v===2||v===4)))).length;
    if(!enemyPieces||checkerMoves(g.board,enemy,null).length===0){finishGame(side,gameState.names[side]+" ganha às damas.");return}
  }
  sendState();
}
function connectWins(board,r,c,player){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  return dirs.some(([dr,dc])=>{
    let count=1;for(const d of [-1,1]){let nr=r+dr*d,nc=c+dc*d;while(nr>=0&&nr<6&&nc>=0&&nc<7&&board[nr][nc]===player){count++;nr+=dr*d;nc+=dc*d}}
    return count>=4
  });
}
function reversiLegal(board,player){
  const out=[],enemy=2-player;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(!board[r][c]){
    const flips=[];
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let rr=r+dr,cc=c+dc,path=[];while(rr>=0&&rr<8&&cc>=0&&cc<8&&board[rr][cc]===enemy){path.push([rr,cc]);rr+=dr;cc+=dc}if(path.length&&rr>=0&&rr<8&&cc>=0&&cc<8&&board[rr][cc]===player)flips.push(...path)}
    if(flips.length)out.push({r:r,c:c,flips:flips});
  }
  return out;
}
function countReversi(board){let a=0,b=0;board.flat().forEach(v=>{if(v===1)a++;if(v===2)b++});return [a,b]}
function finishGame(winner,text){
  if(winner!==null)gameState.scores[winner]++;
  gameState.result={winner:winner,text:text};
  if(winner!==null&&gameState.scores[winner]>=3){gameState.phase="champion";gameState.winner=winner}
  else{gameState.phase="vote";gameState.votes=[null,null]}
  sendState();
}
function nextGame(chosenId){
  const currentId=gameState.game.id;
  let nextId=chosenId||null;
  if(chosenId){
    gameState.order=[chosenId,...shuffle(GAMES.map(g=>g.id).filter(id=>id!==chosenId))];
    gameState.roundIndex=0;
  }else if(gameState.roundIndex+1<gameState.order.length){
    gameState.roundIndex++;
    nextId=gameState.order[gameState.roundIndex];
  }else{
    const remaining=shuffle(GAMES.map(g=>g.id).filter(id=>id!==currentId));
    nextId=remaining[0];
    gameState.order=[nextId,...shuffle(GAMES.map(g=>g.id).filter(id=>id!==nextId))];
    gameState.roundIndex=0;
  }
  gameState.matchNumber=(gameState.matchNumber||1)+1;
  gameState.phase="playing";gameState.votes=[null,null];gameState.result=null;gameState.game=newGame(nextId);selectedSquare=null;sendState();
}
function startFromUrl(){
  renderHome();
  const room=new URLSearchParams(location.search).get("room");
  if(room)showJoinPrompt(room);
}
startFromUrl();
</script>
